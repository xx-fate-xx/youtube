[project]
name = "youtube-studio"
version = "0.1.0"
description = "Local-first production assistant for original documentary/explainer YouTube channels"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "sqlmodel>=0.0.21",
    "pyyaml>=6.0",
    "pillow>=10.3",
    "imageio-ffmpeg>=0.5",
    "numpy>=1.26",        # video pipeline: QA, mix
    "fonttools>=4.40",    # video pipeline: title glyph fallback
]

[project.optional-dependencies]
llm = [
    "anthropic>=1.0",
]
youtube = [
    "google-api-python-client>=2.130",
    "google-auth-oauthlib>=1.2",
]

[project.scripts]
studio = "studio.cli:app"

[dependency-groups]
dev = ["pytest>=8.2", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["studio"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["studio/whatif/prototypes"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008", "UP047", "SIM905"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# ported production modules: long FFmpeg filter graphs, prompts and report lines read better unwrapped
"studio/pipeline/*.py" = ["E501"]
"episodes/*/overlays.py" = ["E501"]
"studio/whatif/*.py" = ["E501"]
"studio/ink3d/*.py" = ["E501"]
"episodes/*/scenes*.py" = ["E501"]
"episodes/*/comic_scenes.py" = ["E501"]
"episodes/*/script_source.py" = ["E501"]
"tests/test_whatif_engine.py" = ["E501"]
