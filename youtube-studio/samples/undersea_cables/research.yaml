# Sample research pack for the Engineering Explained pilot.
#
# IMPORTANT: every claim ships as `unverified` with an empty supporting snippet.
# The URLs point to real, stable reference pages, but nobody has yet confirmed that each
# page supports each claim as worded. The editor must open each source, paste the exact
# supporting snippet, and run `studio claim verify ...`. Wikipedia entries are secondary
# sources: prefer tracing the claim to the primary reference they cite.
title: How Undersea Internet Cables Actually Work
