release:
  hook: 'Super speed and a body nothing can hurt. Sounds like you could save anyone. We test that with real physics in five
    rescues: a fall from the 30th floor, a burning tower, a runaway truck, a bullet, and the 2004 Indian Ocean tsunami.
    The twist: you''re unbreakable. The people you save are not.'
  title_options:
  - What If You Had Super Speed? (And Nothing Could Hurt You)
  - You're Unbreakable. They're Not. (Super Speed Physics)
  - Could a Speedster Actually Save Anyone? The Physics
  tags:
  - what if
  - super speed
  - superpowers physics
  - physics explained
  - g-force
  - speed of sound
  - terminal velocity
  - john paul stapp
  - tsunami warning system
  - science animation
  hashtags:
  - '#whatif'
  - '#physics'
  - '#science'
  sources:
  - FAI Skydiving Commission, belly-to-earth speed ~200 km/h — https://www-2025.fai.org/node/24646
  - The Physics Factbook, terminal velocity of a skydiver — https://hypertextbook.com/facts/1998/JianHuang.shtml
  - CTBUH, height criteria (storey heights) — https://www.skyscrapercenter.com/criteria
  - OpenStax University Physics, motion with constant acceleration — https://openstax.org/books/university-physics-volume-1/pages/3-4-motion-with-constant-acceleration
  - FAA AM 63-15 (Snyder 1963), survival of high-velocity free falls — https://rosap.ntl.bts.gov/view/dot/20857
  - Smithsonian NASM, John Paul Stapp — https://airandspace.si.edu/stories/editorial/man-behind-high-speed-safety-standards
  - NASA History, Stapp's sled runs — https://www.nasa.gov/wp-content/uploads/static/history/afspbio/part4-2.htm
  - Smith & Meaney 2002, roller coasters and g-forces — https://www.engineering.upenn.edu/~molneuro/pdfs/SmithMeaney2002_RollerCoasters.pdf
  - CPSC, fire deaths and smoke inhalation — https://www.cpsc.gov/s3fs-public/fireinj2009.pdf
  - US Fire Administration, home fire escape plans — https://usfa.fema.gov/prevention/home-fires/prepare-for-fire/home-fire-escape-plans
  - IBC stair and landing widths (Humboldt County handout) — https://humboldtcountynv.gov/DocumentCenter/View/3386/Commercial-Stair-Handout-4-19
  - FHWA, truck size and weight (80,000 lb) — https://ops.fhwa.dot.gov/freight/sw/overview/index.htm
  - Utah DOT Truck Smart, stopping distances — https://trucksmart.udot.utah.gov/stopping-distances/
  - CDC NCHS, body measurements — https://www.cdc.gov/nchs/fastats/body-measurements.htm
  - NBS 1948, friction of shoe materials — https://nvlpubs.nist.gov/nistpubs/jres/40/jresv40n5p339_A1b.pdf
  - FMVSS 208, 49 CFR 571.208 (crash tests at 35 mph) — https://www.govinfo.gov/content/pkg/CFR-2016-title49-vol6/pdf/CFR-2016-title49-vol6-sec571-208.pdf
  - Federal 9 mm 115 gr ballistics — https://le.vistaoutdoor.com/ammunition/federal/handgun/details.aspx?id=525
  - Woods et al. 2015, simple reaction time — https://pmc.ncbi.nlm.nih.gov/articles/PMC4374455
  - UK MoD JSP 403, ricochet hazards — https://assets.publishing.service.gov.uk/media/5a7aaadfe5274a34770e6472/JSP403_Vol2_Chap05_DLRSC.pdf
  - USGS, the 2004 Indian Ocean tsunami — https://www.usgs.gov/news/featured-story/indian-ocean-tsunami-remembered-scientists-reflect-2004-indian-ocean-killed
  - NOAA JetStream, tsunami propagation — https://www.noaa.gov/jetstream/tsunamis/tsunami-propagation
  - NOAA JetStream, 2004 tsunami toll — https://www.noaa.gov/jetstream/2004tsu_max
  - UN News, June 2005, warning systems — https://news.un.org/en/story/2005/06/143132
  - Minetti et al. 2012, running on water — https://journals.plos.org/plosone/article?id=10.1371/journal.pone.0037300
  - NASA Dryden, sonic booms — https://www.nasa.gov/centers/dryden/pdf/120274main_FS-016-DFRC.pdf
  - EARSC 2006, Indian Ocean warning system running — https://earsc.org/2006/06/27/indian-ocean-tsunami-warning-system-up-and-running/
  - AFP / phys.org 2011, regional warning centres take over — https://phys.org/news/2011-10-indian-ocean-tsunami-oct.html
  notes:
  - The characters and backgrounds are AI-generated drawings in an original cartoon style; animation, chalk diagrams and
    all calculations are our own. The narration voice, sound effects and music are AI-generated.
  - Our own calculations are simplified (rounded numbers, idealised physics) and marked as estimates.
  - The 2004 tsunami chapter is told with respect for the victims; no victims are depicted.
