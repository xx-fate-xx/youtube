release:
  hook: In August 1858 a cable across the Atlantic carried Queen Victoria's 98-word message to President Buchanan
    — and it took about sixteen hours to get through. A month later the line was dead. This is the engineering story
    of why the first transatlantic telegraph failed, what William Thomson understood that others didn't, and how
    the Great Eastern finally made it work in 1866.
  title_options:
  - 'The Cable That Changed the World: The First Transatlantic Telegraph'
  - '98 Words in 16 Hours: Why the First Atlantic Cable Failed'
  - The 1858 Atlantic Cable Died in a Month. Here's Why.
