    prompt: Heavy cable running over an iron pulley wheel into water, steady rumble and splashing
  s16_brake_squeal:
    prompt: Iron brake clamping hard on a turning drum, loud metal squeal and grinding
  s17_cable_snap:
    prompt: Taut thick cable snapping with a sharp crack, whipping through the air, heavy splash into the sea
  s18_thunder:
    prompt: Close thunder crack followed by a long rolling rumble over the open sea
  s19_hull_creak:
    prompt: Wooden ship hull groaning and creaking under strain, heavy coils sliding across a wet deck
  s20_beach_cheer:
    prompt: Small crowd cheering on a beach, waves lapping, distant and joyful
  s21_sparks:
    prompt: High-voltage electric sparks arcing between brass terminals, loud crackling zaps and buzzing
  s22_bubbles:
    prompt: Underwater bubbles rising and fizzing, muffled deep water
  s23_book_drop:
    prompt: Heavy leather-bound book dropped onto a wooden desk, deep thud, papers fluttering
  s24_grapple_drag:
    prompt: Iron grappling hook dragging through sand and gravel underwater, muffled scraping, rope tension
  s25_rope_snap:
    prompt: Thick rope snapping under load, ship windlass ratchet spinning free, men shouting
  s26_whoosh:
    prompt: Soft deep airy whoosh transition, smooth and subtle
  s27_boom:
    prompt: Deep low cinematic boom impact with a long dark reverb tail
  s28_data_pulse:
    prompt: Fast soft electronic data pulse swish, light shimmering tone
  s29_laptop_click:
    prompt: Single laptop trackpad click followed by a soft keyboard tap, quiet room
  s30_galvo_tick:
    prompt: Tiny delicate mechanical ticks of a small brass instrument needle swinging, close-mic
