# Sound library of the episode (ElevenLabs: eleven_text_to_sound_v3 effects/ambiences, eleven_music_v2_5 music).
# Files: projects/enginovue_cable_1858/audio/{sfx,music}/<id>.mp3. Placement lives in frames.txt (AMB/SFX/MUSIC).
duck_db:
  music: 6
  ambience: 4
  sfx: 6
chapter_whoosh:
  sfx: s26_whoosh
  at: -0.9
  gain_db: -12
spots:
  s01_telegraph_key:
    prompt: Brass telegraph key tapping Morse code, crisp metallic clicks, close-mic, small wooden room
  s02_clock_tick:
    prompt: Large old wall clock ticking slowly, deep wooden tick-tock, quiet room
  s03_crowd_cheer:
    prompt: Large outdoor crowd bursting into cheers and applause, joyful shouting, city street
  s04_church_bells:
    prompt: Church bells ringing in celebration from a stone tower, bright and resonant
  s05_fireworks:
    prompt: Fireworks launching and bursting overhead, crackling sparkles, distant booms echoing off buildings
  s06_roof_fire:
    prompt: Roof fire crackling and roaring, wooden beams popping, distant alarmed shouts
  s07_shop_bell:
    prompt: Small brass shop door bell jingling as a door opens, quiet shop interior
  s08_signal_fade:
    prompt: Weak electrical buzzing signal slowly fading out to silence, low hum dying away
  s09_steamship:
    prompt: Old steamship whistle blowing in the distance, paddle wheel churning water
  s10_locomotive:
    prompt: Steam locomotive chugging past with puffs of steam and a short whistle
  s11_quill:
    prompt: Quill pen scratching on paper, close-mic, quiet study
  s12_chalk:
    prompt: Chalk writing quickly on a blackboard, crisp scratches and taps
  s13_audience_murmur:
    prompt: Audience murmuring and stirring in a lecture hall, a few raised voices
  s14_wire_twisting:
