music:
  m1_opening:
    prompt: 'Instrumental orchestral documentary opening with a Victorian 1850s atmosphere: gentle anticipation
      with a soft ticking pulse, building to a short celebratory swell of strings and brass, then turning quiet,
      uncertain and mysterious at the end. Sparse and unobtrusive, made to sit under voice-over. No vocals.'
    duration: 58
    instrumental: true
  m2_journey:
    prompt: 'Instrumental documentary underscore about ambitious 19th-century engineering and voyages at sea: a
      steady, curious pulse with warm strings, piano and light percussion; determined and inventive, with rising
      tension and a dramatic storm-like passage in the second half, then a hopeful lift at the end. Subdued enough
      to sit under voice-over. No vocals.'
    duration: 250
    instrumental: true
  m3_resolve:
    prompt: 'Instrumental documentary underscore: a setback turning into perseverance and triumph. Starts introspective
      and minor-key with solo piano and cello, grows steadily with strings, reaches a confident, uplifting orchestral
      peak, and ends in a calm, modern and hopeful outro with soft electronic textures. Made to sit under voice-over.
      No vocals.'
    duration: 245
    instrumental: true
