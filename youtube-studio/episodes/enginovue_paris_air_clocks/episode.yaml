  notes:
  - 'All facts in the narration were checked against the sources above (fact-check report: 34 corrections). Where sources
    disagree (for example on which floor of 7 rue Sainte-Anne held the master clock) the script avoids the disputed detail.'
  - 'A few details rest on a single company history (SUDAC): the 13-day interruption in 1910, the purge of the pipes and the
    hand-over of customers to Magneta.'
