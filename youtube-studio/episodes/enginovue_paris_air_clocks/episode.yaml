release:
  hook: On the evening of 21 January 1910, every pneumatic clock in Paris stopped within five minutes. For nearly thirty years
    their hands had been pushed forward by puffs of compressed air, sent once a minute through pipes in the sewers. This is
    how the air clocks worked, why the flooded Seine stopped them, and how the same company built a compressed-air power network
    that ran until 1994.
