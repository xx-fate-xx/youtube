  - Federal 9 mm 115 gr ballistics (≈1,180 ft/s) — https://le.vistaoutdoor.com/ammunition/federal/handgun/details.aspx?id=525
  - NASA, International Space Station (orbits about 250 miles up) — https://www.nasa.gov/international-space-station/
  - NASA, ISS transition plan FAQ (~257 miles, 415 km) — https://www.nasa.gov/faqs-the-international-space-station-transition-plan/
