  hook: 'You can teleport anywhere, instantly. One rule: your speed comes with you. That turns a rescue into a crash, a
    trip to the North Pole into a skid faster than a bullet, and the spinning planet into a trap. We test it with real physics,
    and find the one secret route where it works perfectly.'
